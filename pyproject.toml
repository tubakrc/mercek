[project]
name = "mercek"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.18",
    "mcp>=2.3.0",
    "numpy>=2.5.4",
    "openai>=3.40.0",
    "pymupdf>=2.0",
    "pymupdf4llm>=2.0",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "streamlit>=1.66.1",
    "yfinance>=1.7.0",
]

[project.scripts]
mercek = "mercek:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
